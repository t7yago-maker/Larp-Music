name: Build LARP MUSIC APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if it was uploaded as LarpMusic.zip
        run: |
          if [ -f "LarpMusic.zip" ]; then
            echo "Found LarpMusic.zip — extracting project files into the repo root."
            unzip -o LarpMusic.zip -d .
          else
            echo "No LarpMusic.zip found — assuming the project was committed as real files."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Write local.properties (Jamendo client id from repo secret)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -n "${{ secrets.JAMENDO_CLIENT_ID }}" ]; then
            echo "JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}" >> local.properties
          fi

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: larpmusic-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check whether release signing secrets are configured
        id: release_secrets
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.release_secrets.outputs.configured == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Assemble release APK
        if: steps.release_secrets.outputs.configured == 'true'
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload release APK
        if: steps.release_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: larpmusic-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
